theme: jekyll-theme-minimal

markdown: kramdown
kramdown:
  syntax_highlighter: rouge
highlighter: rouge
plugins_dir: _plugins
baseurl: /stable-diffusion

title: "Stable Diffusion"
description: "Local image generation with stable-diffusion.cpp. Run a local server or integrate it with 4D."
url: "https://miyako.github.io"
logo: "/assets/stable-diffusion.png"
component_version: "20.0.12"
show_downloads: false      # component releases are linked from the home page
github:
  is_user_page: true
  owner_url: "https://github.com/miyako"
  repository_url: "https://github.com/miyako/stable-diffusion"
  is_project_page: false

exclude:
  - "vendor"
  - "resources"
  - "LICENSE"
  - "README.md"
  - "SITE-DESIGN.md"
  - "package.json"
  - "Gemfile"
  - "scripts"
  - "native"
  - "tests"
  - "stable-diffusion"
  - "cpp"
  - "include"
  - "ai_studio_code.cpp"
